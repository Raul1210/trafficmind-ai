<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 — Access Forbidden | TrafficMind AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090f;color:#e2e8f0;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{text-align:center;padding:48px 56px;border:1px solid rgba(255,68,68,.2);border-radius:16px;background:#0c1018;max-width:420px}
.code{font-size:72px;font-weight:700;color:#ff4444;font-family:'Rajdhani',sans-serif;letter-spacing:4px}
h2{font-size:18px;margin:12px 0 8px;color:#e2e8f0}
p{font-size:13px;color:#64748b;margin-bottom:28px}
a{display:inline-block;padding:10px 24px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);border-radius:8px;color:#00e5ff;font-size:13px;text-decoration:none;transition:background .2s}
a:hover{background:rgba(0,229,255,.2)}
</style>
</head>
<body>
  <div class="card">
    <div class="code">403</div>
    <h2>Access Forbidden</h2>
    <p>You do not have permission to access this page.</p>
    <a href="/">&#8592; Back to Dashboard</a>
  </div>
</body>
</html>
