[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smart-traffic-monitor"
version = "1.0.0"
description = "Real-time traffic monitoring with YOLOv8 and Q-learning"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Web framework
    "flask==3.1.3",
    "flask-wtf>=1.2.0",          # CSRF protection

    # Computer vision
    "opencv-python==4.13.0.92",
    "numpy==2.4.2",

    # Object detection
    "ultralytics==8.4.19",

    # Image processing
    "pillow==12.1.1",

    # Config / serialisation
    "pyyaml==6.0.3",

    # Video ingestion
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
# pip install -e . && traffic-monitor
traffic-monitor = "run:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_monitor*"]

# ── Linting ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore  = ["E501"]  # long lines handled by formatter

# ── Type checking ──────────────────────────────────────────────────────────
[tool.mypy]
python_version   = "3.10"
ignore_missing_imports = true
warn_return_any  = true

# ── Testing ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
